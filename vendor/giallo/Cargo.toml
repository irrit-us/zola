[package]
edition = "2024"
name = "giallo"
version = "0.5.2"
build = false
include = [
    "src/**/*.rs",
    "benches/**/*",
    "examples/**/*",
    "tools/**/*",
    "Cargo.toml",
    "/LICENSE",
    "/README.md",
    "builtin.zst",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A code highlighter giving the same output as VSCode"
readme = "README.md"
license = "EUPL-1.2"
repository = "https://github.com/getzola/giallo"

[features]
debug = ["dep:log"]
dump = [
    "dep:bitcode",
    "dep:zstd",
]
tools = ["dump"]

[lib]
name = "giallo"
path = "src/lib.rs"

[[bin]]
name = "build-registry"
path = "tools/build_registry.rs"
required-features = ["tools"]

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["dump"]

[[example]]
name = "custom_rendering"
path = "examples/custom_rendering.rs"
required-features = ["dump"]

[[example]]
name = "html_classes"
path = "examples/html_classes.rs"
required-features = ["dump"]

[[example]]
name = "output_html"
path = "examples/output_html.rs"
required-features = ["dump"]

[[example]]
name = "output_terminal"
path = "examples/output_terminal.rs"
required-features = ["dump"]

[[example]]
name = "profile_jquery"
path = "examples/profile_jquery.rs"
required-features = ["dump"]

[[example]]
name = "profile_simple_ts"
path = "examples/profile_simple_ts.rs"
required-features = ["dump"]

[[bench]]
name = "highlight_benchmark"
path = "benches/highlight_benchmark.rs"
harness = false
required-features = ["dump"]

[[bench]]
name = "registry"
path = "benches/registry.rs"
harness = false
required-features = ["dump"]

[dependencies.bitcode]
version = "0.6.9"
features = ["serde"]
optional = true

[dependencies.log]
version = "0.4"
optional = true

[dependencies.onig]
version = "6"
default-features = false
package = "onig-regset"

[dependencies.papaya]
version = "0.2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.zstd]
version = "0.13.3"
optional = true

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.insta]
version = "1"
features = ["yaml"]

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.release]
debug = 2
